[package]
name = "mdread"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
description = "A very fast GPU-rendered Markdown viewer for large, high-DPI screens"
license = "MIT"
repository = "https://github.com/vaughnd/mdread"
homepage = "https://github.com/vaughnd/mdread"

[dependencies]
egui = { version = "0.35", features = ["serde"] }
egui_extras = { version = "0.35", default-features = false, features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
syntect = { version = "5", default-features = false, features = ["parsing", "dump-load", "regex-fancy", "default-themes"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
notify = "8"
# shellexecute-on-windows: ShellExecuteExW directly instead of a PowerShell process per click.
open = { version = "5", features = ["shellexecute-on-windows"] }
# Canonical paths without the \\?\ prefix on Windows (std::fs::canonicalize elsewhere).
dunce = "1"
# Text files that are not UTF-8: BOM-tagged UTF-16, or the legacy ANSI code page.
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mermaid diagrams, laid out as SVG without a browser. Pinned: later releases need rustc 1.95.
merman = { version = "=0.7.0-alpha.1", features = ["render"] }
# Same version as egui_extras uses. Draws the diagrams, and on Windows backs the SVG loader
# that restricts <image href>.
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# The version resvg uses; to find a font for a character that diagram fonts lack.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
env_logger = { version = "0.11", default-features = false }
log = "0.4"

[target.'cfg(not(windows))'.dependencies]
egui_extras = { version = "0.35", default-features = false, features = ["all_loaders", "svg_text"] }
eframe = { version = "0.35", default-features = false, features = ["glow", "wayland", "x11", "persistence", "default_fonts"] }

# Windows starts with glow and falls back to wgpu (DX12, or the WARP software adapter in
# VMs and RDP sessions) when no usable OpenGL driver is present. Only the DX12 backend of
# wgpu is compiled in.
[target.'cfg(windows)'.dependencies]
# No "svg_text" here: it makes the SVG loader scan every system font at startup, which is
# slow on Windows. The cost is that text inside SVGs (badge labels) is not drawn.
eframe = { version = "0.35", default-features = false, features = ["glow", "wgpu_no_default_features", "persistence", "default_fonts"] }
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
rfd = { version = "0.17", default-features = false }
# The window handle eframe gives out, for the dialog owner and the title bar colour.
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
